# conf file for query-deny-action test
server:
	logfile: "nsd.log"
	zonesdir: ""
	username: ""
	database: ""
	verbosity: 2
	zonelistfile: "zone.list"
	interface: 127.0.0.1

pattern:
	name: "deny-nxdomain"
	allow-query: 192.0.2.0/24 NOKEY
	query-deny-action: nxdomain

zone:
	name: allowed.example
	zonefile: query_deny_action.allowed.zone
	allow-query: 127.0.0.0/8 NOKEY

zone:
	name: default.example
	zonefile: query_deny_action.default.zone
	allow-query: 192.0.2.0/24 NOKEY

zone:
	name: refuse.example
	zonefile: query_deny_action.refuse.zone
	allow-query: 192.0.2.0/24 NOKEY
	query-deny-action: refuse

zone:
	name: drop.example
	zonefile: query_deny_action.drop.zone
	allow-query: 192.0.2.0/24 NOKEY
	query-deny-action: drop

zone:
	name: nxdomain.example
	zonefile: query_deny_action.nxdomain.zone
	allow-query: 192.0.2.0/24 NOKEY
	query-deny-action: nxdomain

zone:
	name: pattern.example
	zonefile: query_deny_action.pattern.zone
	include-pattern: "deny-nxdomain"
